<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>KASUGAI — Scroll Canvas</title>
    <meta name="description" content="KASUGAI collaborative drawing canvas — paint your battle plans together." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" />
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>

    <style>
        /* ─── KASUGAI Palette ─────────────────── */
        :root {
            --night:          #10101A;
            --crimson:        #731A1E;
            --crimson-hot:    #9b2226;
            --crimson-dim:    #4f1214;
            --timber:         #33261C;
            --gold:           #DFA83E;
            --gold-dim:       #a87b28;
            --shadow:         #2C3036;
            --parchment:      #EFE8D1;
            --parchment-dim:  #c8bfa4;
            --indigo:         #271E2D;
            --text-dim:       #a09277;
            --border:         rgba(115, 26, 30, 0.35);
            --border-gold:    rgba(223, 168, 62, 0.30);
            --glow-gold:      0 0 14px rgba(223, 168, 62, 0.40);
            --glow-crimson:   0 0 18px rgba(115, 26, 30, 0.55);
            --font-display:   'Cinzel', serif;
            --font-body:      'Inter', sans-serif;
            --radius:         10px;
            --transition:     0.22s ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background-color: var(--night);
            color: var(--parchment);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            background-image:
                radial-gradient(ellipse 80% 60% at 10% 110%, rgba(115,26,30,0.12) 0%, transparent 65%),
                radial-gradient(ellipse 60% 50% at 90% -10%, rgba(39,30,45,0.2) 0%, transparent 70%);
        }

        /* ─── Scrollbar ──────────────────────── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--night); }
        ::-webkit-scrollbar-thumb { background: var(--crimson-dim); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--crimson); }

        /* ─── Top Bar ────────────────────────── */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1.6rem;
            background: linear-gradient(90deg, var(--indigo) 0%, var(--timber) 50%, var(--indigo) 100%);
            border-bottom: 1px solid var(--border-gold);
            box-shadow: 0 2px 20px rgba(0,0,0,0.4);
            flex-shrink: 0;
            position: relative;
        }

        .top-bar::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.45;
        }

        .brand {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.12em;
            text-shadow: var(--glow-gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand span { font-size: 0.75rem; color: var(--parchment-dim); font-family: var(--font-body); letter-spacing: 0.04em; }

        .room-id-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--parchment-dim);
        }

        .room-id-wrap strong {
            font-family: monospace;
            color: var(--gold);
            background: rgba(223,168,62,0.08);
            padding: 3px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-gold);
        }

        .undo-redo {
            display: flex;
            gap: 6px;
        }

        /* ─── Buttons ────────────────────────── */
        .btn {
            font-family: var(--font-body);
            font-size: 0.82rem;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: var(--radius);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.03em;
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-ghost {
            background: rgba(44,48,54,0.6);
            color: var(--parchment-dim);
            border-color: rgba(100,100,120,0.3);
        }

        .btn-ghost:not(:disabled):hover {
            background: rgba(44,48,54,0.9);
            color: var(--parchment);
            border-color: var(--border-gold);
        }

        .btn-crimson {
            background: linear-gradient(135deg, var(--crimson) 0%, var(--crimson-hot) 100%);
            color: var(--parchment);
            border-color: rgba(155,34,38,0.5);
            box-shadow: 0 3px 10px rgba(115,26,30,0.35);
        }

        .btn-crimson:not(:disabled):hover {
            transform: translateY(-1px);
            box-shadow: var(--glow-crimson);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold-dim) 0%, var(--gold) 100%);
            color: var(--night);
            border-color: rgba(223,168,62,0.4);
            font-family: var(--font-display);
        }

        .btn-gold:not(:disabled):hover {
            transform: translateY(-1px);
            box-shadow: var(--glow-gold);
        }

        .btn-copy {
            font-size: 0.75rem;
            padding: 4px 10px;
            background: rgba(223,168,62,0.1);
            color: var(--gold);
            border: 1px solid var(--border-gold);
            border-radius: 6px;
        }

        .btn-copy:hover { background: rgba(223,168,62,0.2); }

        .btn-eraser-active {
            background: linear-gradient(135deg, var(--gold-dim) 0%, var(--gold) 100%) !important;
            color: var(--night) !important;
            border-color: var(--gold) !important;
        }

        /* ─── Layout ─────────────────────────── */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 0;
        }

        /* ─── Toolbar (Left Panel) ───────────── */
        .toolbar {
            width: 230px;
            flex-shrink: 0;
            background: linear-gradient(180deg, var(--indigo) 0%, var(--night) 100%);
            border-right: 1px solid var(--border);
            padding: 1.2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
            overflow-y: auto;
        }

        .toolbar-section { display: flex; flex-direction: column; gap: 0.6rem; }

        .toolbar-label {
            font-family: var(--font-display);
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .tool-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .tool-row label {
            font-size: 0.82rem;
            color: var(--parchment-dim);
        }

        /* Color Picker */
        .color-swatch-wrap {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--border-gold);
            cursor: pointer;
            flex-shrink: 0;
        }

        input[type="color"] {
            position: absolute;
            inset: -6px;
            width: calc(100% + 12px);
            height: calc(100% + 12px);
            border: none;
            cursor: pointer;
            padding: 0;
            background: transparent;
        }

        /* Thickness Slider */
        .slider-wrap { width: 100%; }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            background: linear-gradient(90deg, var(--crimson) var(--val, 10%), rgba(255,255,255,0.1) var(--val, 10%));
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--gold);
            cursor: pointer;
            border: 2px solid var(--night);
            box-shadow: 0 0 6px rgba(223,168,62,0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--gold);
            cursor: pointer;
            border: 2px solid var(--night);
        }

        .thickness-value {
            font-size: 0.78rem;
            color: var(--gold);
            font-weight: 600;
            min-width: 30px;
            text-align: right;
        }

        /* Preset swatches */
        .color-presets {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
        }

        .color-preset {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color var(--transition), transform var(--transition);
        }

        .color-preset:hover { transform: scale(1.15); border-color: var(--gold); }
        .color-preset.active { border-color: var(--gold); box-shadow: var(--glow-gold); }

        /* Save format */
        select {
            background: rgba(16,16,26,0.7);
            color: var(--parchment);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 6px 10px;
            font-family: var(--font-body);
            font-size: 0.82rem;
            outline: none;
            width: 100%;
            cursor: pointer;
        }

        select:focus { border-color: var(--gold); }
        select option { background: var(--indigo); }

        /* ─── Canvas Area ────────────────────── */
        .canvas-wrap {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--shadow);
        }

        canvas {
            display: block;
            touch-action: none;
            cursor: crosshair;
            width: 100%;
            height: 100%;
        }

        /* ─── Right Panel ────────────────────── */
        .right-panel {
            width: 190px;
            flex-shrink: 0;
            background: linear-gradient(180deg, var(--indigo) 0%, var(--night) 100%);
            border-left: 1px solid var(--border);
            padding: 1.2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
        }

        .contributors-header {
            font-family: var(--font-display);
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .contributors-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .contributor-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 8px;
            background: rgba(51,38,28,0.25);
            border: 1px solid var(--border);
            animation: fadeIn 0.3s ease;
        }

        .contributor-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--crimson) 0%, var(--timber) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--parchment);
            flex-shrink: 0;
            border: 1px solid var(--border-gold);
        }

        .contributor-name {
            font-size: 0.8rem;
            color: var(--parchment-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .contributor-you {
            font-size: 0.65rem;
            color: var(--gold);
            font-weight: 600;
            margin-left: auto;
        }

        /* ─── Toast Notification ─────────────── */
        .toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            padding: 12px 20px;
            border-radius: var(--radius);
            font-size: 0.88rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.35s ease, transform 0.35s ease;
            z-index: 9999;
            pointer-events: none;
            max-width: 300px;
            backdrop-filter: blur(8px);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background: rgba(51,38,28,0.9);
            border: 1px solid var(--border-gold);
            color: var(--gold);
        }

        .toast.error {
            background: rgba(115,26,30,0.85);
            border: 1px solid var(--crimson-hot);
            color: #f08080;
        }

        /* ─── Modal ──────────────────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.hidden { display: none; }

        .modal-card {
            background: linear-gradient(145deg, var(--timber) 0%, var(--indigo) 100%);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 40px 36px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6), var(--glow-crimson);
            position: relative;
            overflow: hidden;
        }

        .modal-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .modal-card h2 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 8px;
            text-shadow: var(--glow-gold);
        }

        .modal-card p {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 28px;
        }

        .modal-card input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.92rem;
            font-family: var(--font-body);
            background: rgba(16,16,26,0.7);
            color: var(--parchment);
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .modal-card input[type="text"]::placeholder { color: var(--text-dim); }
        .modal-card input[type="text"]:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(223,168,62,0.12);
        }

        .modal-card button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--crimson) 0%, var(--crimson-hot) 100%);
            color: var(--parchment);
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-family: var(--font-display);
            font-weight: 600;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 14px rgba(115,26,30,0.4);
        }

        .modal-card button:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-crimson);
        }

        /* ─── Animations ─────────────────────── */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }

        /* ─── Mobile (≤ 768px) ───────────────── */
        @media (max-width: 768px) {

            /* Lock the page — no scroll, fixed viewport */
            html, body {
                height: 100dvh;
                overflow: hidden;
                position: fixed;
                width: 100%;
            }

            /* App container spans full screen */
            #appContainer {
                position: fixed !important;
                top: 0; left: 0; right: 0; bottom: 0;
                height: 100dvh !important;
                display: flex !important;
                flex-direction: column !important;
            }

            /* Compact top-bar */
            .top-bar {
                padding: 0.5rem 0.8rem;
                flex-wrap: nowrap;
                gap: 6px;
            }

            .brand span { display: none; }

            .room-id-wrap {
                font-size: 0.72rem;
                flex: 1;
                min-width: 0;
            }

            .room-id-wrap strong {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                max-width: 90px;
                display: inline-block;
            }

            .btn { font-size: 0.72rem; padding: 5px 8px; }

            /* Workspace = canvas only, full remaining height */
            .workspace {
                flex: 1 !important;
                overflow: hidden !important;
                position: relative !important;
                min-height: 0 !important;
            }

            /* Hide desktop sidebar panels */
            .toolbar, .right-panel { display: none !important; }

            /* Canvas fills entire workspace */
            .canvas-wrap {
                position: absolute !important;
                inset: 0 !important;
                flex: unset !important;
                overflow: hidden !important;
            }

            canvas {
                width: 100% !important;
                height: 100% !important;
            }

            /* ── Mobile bottom action bar ─────── */
            #mobileActionBar {
                display: flex !important;
            }

            /* ── Tool drawer (bottom sheet) ───── */
            #mobileToolDrawer {
                display: flex !important;
            }

            /* ── People overlay ──────────────── */
            #mobilePeoplePanel {
                display: flex !important;
            }

            /* Toast clears the action bar */
            .toast { bottom: 90px !important; }
        }

        /* ── Mobile-only elements (hidden on desktop) ── */

        /* Bottom action bar */
        #mobileActionBar {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 64px;
            background: linear-gradient(90deg, rgba(16,16,26,0.97) 0%, rgba(39,30,45,0.97) 100%);
            border-top: 1px solid var(--border-gold);
            backdrop-filter: blur(14px);
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            gap: 8px;
            z-index: 300;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }

        .mob-bar-btn {
            background: rgba(44,48,54,0.7);
            border: 1px solid rgba(100,100,120,0.3);
            color: var(--parchment-dim);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.18s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .mob-bar-btn:active { transform: scale(0.9); background: rgba(223,168,62,0.15); }
        .mob-bar-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(223,168,62,0.15); }

        #mobColorSwatch {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.18s ease;
            box-shadow: 0 0 10px rgba(223,168,62,0.3);
        }

        #mobColorSwatch:active { transform: scale(0.9); }

        #mobSizeLabel {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-align: center;
            flex-shrink: 0;
            min-width: 28px;
            font-weight: 600;
        }

        #mobSizeSlider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: linear-gradient(90deg, var(--crimson) var(--val, 10%), rgba(255,255,255,0.1) var(--val, 10%));
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            max-width: 100px;
        }

        #mobSizeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--gold);
            cursor: pointer;
            border: 2px solid var(--night);
            box-shadow: 0 0 6px rgba(223,168,62,0.5);
        }

        /* ── Tool Drawer (bottom sheet) ─────────── */
        #mobileToolDrawer {
            display: none;
            position: fixed;
            bottom: 64px; left: 0; right: 0;
            max-height: 55dvh;
            overflow-y: auto;
            background: linear-gradient(180deg, rgba(39,30,45,0.99) 0%, rgba(16,16,26,0.99) 100%);
            border-top: 1px solid var(--border-gold);
            border-radius: 20px 20px 0 0;
            flex-direction: column;
            gap: 0;
            z-index: 290;
            box-shadow: 0 -8px 32px rgba(0,0,0,0.6);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(16px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        #mobileToolDrawer.open {
            transform: translateY(0);
        }

        .drawer-handle {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin: 10px auto 0;
            flex-shrink: 0;
        }

        .drawer-section {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(115,26,30,0.2);
        }

        .drawer-section:last-child { border-bottom: none; }

        .drawer-label {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 10px;
        }

        .drawer-color-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .drawer-preset {
            aspect-ratio: 1;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s ease, border-color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .drawer-preset:active { transform: scale(1.2); }
        .drawer-preset.active { border-color: var(--gold); box-shadow: 0 0 8px rgba(223,168,62,0.5); }

        .drawer-custom-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }

        .drawer-custom-label { font-size: 0.82rem; color: var(--parchment-dim); }

        .drawer-color-swatch {
            position: relative;
            width: 36px; height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--border-gold);
            cursor: pointer;
            flex-shrink: 0;
        }

        .drawer-color-swatch input[type="color"] {
            position: absolute;
            inset: -6px;
            width: calc(100% + 12px);
            height: calc(100% + 12px);
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .drawer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .drawer-full-btn {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 9px 16px;
            border-radius: 10px;
            border: 1px solid transparent;
            cursor: pointer;
            flex: 1;
            transition: all 0.18s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .drawer-full-btn:active { transform: scale(0.96); }

        .drawer-btn-ghost {
            background: rgba(44,48,54,0.7);
            color: var(--parchment-dim);
            border-color: rgba(100,100,120,0.3);
        }

        .drawer-btn-crimson {
            background: linear-gradient(135deg, var(--crimson) 0%, var(--crimson-hot) 100%);
            color: var(--parchment);
            border-color: rgba(155,34,38,0.5);
        }

        .drawer-btn-gold {
            background: linear-gradient(135deg, var(--gold-dim) 0%, var(--gold) 100%);
            color: var(--night);
            font-family: 'Cinzel', serif;
        }

        .drawer-size-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .drawer-size-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            background: linear-gradient(90deg, var(--crimson) var(--val, 10%), rgba(255,255,255,0.1) var(--val, 10%));
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .drawer-size-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: var(--gold);
            cursor: pointer;
            border: 2px solid var(--night);
            box-shadow: 0 0 6px rgba(223,168,62,0.5);
        }

        .drawer-size-val {
            font-size: 0.78rem;
            color: var(--gold);
            font-weight: 600;
            min-width: 36px;
            text-align: right;
        }

        /* ── People Panel (overlay) ─────────────── */
        #mobilePeoplePanel {
            display: none;
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 220px;
            background: linear-gradient(180deg, rgba(39,30,45,0.98) 0%, rgba(16,16,26,0.98) 100%);
            border-left: 1px solid var(--border-gold);
            flex-direction: column;
            gap: 0;
            z-index: 400;
            backdrop-filter: blur(16px);
            box-shadow: -8px 0 32px rgba(0,0,0,0.5);
            transform: translateX(100%);
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #mobilePeoplePanel.open {
            transform: translateX(0);
        }

        .people-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1rem 0.8rem;
            border-bottom: 1px solid var(--border);
        }

        .people-panel-title {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .people-panel-close {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.18s ease;
        }

        .people-panel-close:hover { color: var(--crimson-hot); }

        .people-panel-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Dim backdrop when people panel is open */
        #peoplePanelBackdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 399;
            backdrop-filter: blur(2px);
        }

        #peoplePanelBackdrop.show { display: block; }
    </style>
    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#10101A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW registration failed:', err));
            });
        }
    </script>
</head>
<body>

    <!-- Room Entry Modal -->
    <div id="roomModal" class="modal-overlay">
        <div class="modal-card">
            <h2>🐦‍⬛ Join Scroll Room</h2>
            <p>Enter your name and a room ID to begin collaborative drawing with fellow Demon Slayers.</p>
            <input type="text" id="usernameInput" placeholder="Your crow name..." />
            <input type="text" id="roomInput" placeholder="Room ID (e.g. hashira-war-room)" />
            <button id="joinRoomBtn">Enter the Room &nbsp;→</button>
        </div>
    </div>

    <!-- App (hidden until room is joined) -->
    <div id="appContainer" style="display: none; flex-direction: column; height: 100dvh;">

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand">
                🐦‍⬛ KASUGAI <span>/ Scroll Canvas</span>
            </div>
            <div class="room-id-wrap">
                Room: <strong id="currentRoomId">—</strong>
                <button id="copyRoomIdBtn" class="btn-copy">Copy ID</button>
            </div>
            <div class="undo-redo">
                <!-- Mobile-only toolbar toggle -->
                <button id="mobileToolbarToggle" class="btn btn-ghost" style="display:none">
                    🎨 Tools
                </button>
                <button id="undoBtn" class="btn btn-ghost" disabled>↩ Undo</button>
                <button id="redoBtn" class="btn btn-ghost" disabled>↪ Redo</button>
                <button id="closeCanvasBtn" class="btn btn-ghost">✕ Exit</button>
            </div>
        </div>

        <!-- Workspace -->
        <div class="workspace" style="flex: 1; overflow: hidden;">

            <!-- Left Toolbar -->
            <div class="toolbar">

                <!-- Pen Color -->
                <div class="toolbar-section">
                    <div class="toolbar-label">Ink Color</div>
                    <div class="tool-row">
                        <label>Custom</label>
                        <div class="color-swatch-wrap">
                            <input type="color" id="colorPicker" value="#EFE8D1" />
                        </div>
                    </div>
                    <div class="color-presets" id="colorPresets">
                        <!-- Injected by JS -->
                    </div>
                </div>

                <!-- Pen Thickness -->
                <div class="toolbar-section">
                    <div class="toolbar-label">Brush Size</div>
                    <div class="tool-row">
                        <div class="slider-wrap">
                            <input type="range" id="thicknessSlider" min="1" max="60" value="5" />
                        </div>
                        <span class="thickness-value" id="thicknessValue">5px</span>
                    </div>
                </div>

                <!-- Tools -->
                <div class="toolbar-section">
                    <div class="toolbar-label">Tools</div>
                    <button id="eraserBtn" class="btn btn-ghost" style="width:100%">⬜ Eraser</button>
                    <button id="clearBtn" class="btn btn-crimson" style="width:100%">🗑 Clear Scroll</button>
                </div>

                <!-- Save -->
                <div class="toolbar-section">
                    <div class="toolbar-label">Export Scroll</div>
                    <select id="saveFormat">
                        <option value="image/png">PNG (lossless)</option>
                        <option value="image/jpeg">JPEG (compressed)</option>
                        <option value="image/webp">WebP (modern)</option>
                    </select>
                    <button id="saveBtn" class="btn btn-gold" style="width:100%; margin-top:4px">📜 Save Drawing</button>
                </div>
            </div>

            <!-- Canvas -->
            <div class="canvas-wrap">
                <canvas id="drawingCanvas"></canvas>
            </div>

            <!-- Right Panel — Contributors -->
            <div class="right-panel">
                <div class="contributors-header">Active Crows</div>
                <div class="contributors-list" id="contributorsList">
                    <!-- Populated by JS -->
                </div>
            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- ═══════════════════════════════════════ -->
    <!-- MOBILE-ONLY UI                          -->
    <!-- ═══════════════════════════════════════ -->

    <!-- Mobile Bottom Action Bar -->
    <div id="mobileActionBar">
        <!-- Color swatch — tap to open drawer -->
        <div id="mobColorSwatch" title="Color & Tools"></div>

        <!-- Brush size mini slider -->
        <input type="range" id="mobSizeSlider" min="1" max="60" value="5" />
        <span id="mobSizeLabel">5px</span>

        <!-- Eraser toggle -->
        <button class="mob-bar-btn" id="mobEraserBtn" title="Eraser">⬜</button>

        <!-- Undo / Redo -->
        <button class="mob-bar-btn" id="mobUndoBtn" title="Undo">↩</button>
        <button class="mob-bar-btn" id="mobRedoBtn" title="Redo">↪</button>

        <!-- People toggle -->
        <button class="mob-bar-btn" id="mobPeopleBtn" title="Active Crows">👥</button>

        <!-- Expand ↑ (open full drawer) -->
        <button class="mob-bar-btn" id="mobExpandBtn" title="More tools">
            <span id="mobExpandIcon">⌃</span>
        </button>
    </div>

    <!-- Mobile Tool Drawer (bottom sheet) -->
    <div id="mobileToolDrawer">
        <div class="drawer-handle"></div>

        <!-- Ink Color Section -->
        <div class="drawer-section">
            <div class="drawer-label">Ink Color</div>
            <div class="drawer-color-grid" id="drawerColorPresets">
                <!-- populated by JS -->
            </div>
            <div class="drawer-custom-row">
                <span class="drawer-custom-label">Custom</span>
                <div class="drawer-color-swatch">
                    <input type="color" id="drawerColorPicker" value="#EFE8D1" />
                </div>
            </div>
        </div>

        <!-- Brush Size Section -->
        <div class="drawer-section">
            <div class="drawer-label">Brush Size</div>
            <div class="drawer-size-row">
                <input type="range" class="drawer-size-slider" id="drawerSizeSlider" min="1" max="60" value="5" />
                <span class="drawer-size-val" id="drawerSizeVal">5px</span>
            </div>
        </div>

        <!-- Tools Section -->
        <div class="drawer-section">
            <div class="drawer-label">Tools</div>
            <div class="drawer-row">
                <button class="drawer-full-btn drawer-btn-ghost" id="drawerEraserBtn">⬜ Eraser</button>
                <button class="drawer-full-btn drawer-btn-crimson" id="drawerClearBtn">🗑 Clear</button>
            </div>
        </div>

        <!-- Export Section -->
        <div class="drawer-section">
            <div class="drawer-label">Export Scroll</div>
            <select id="drawerSaveFormat" style="width:100%; background:rgba(16,16,26,0.7); color:#EFE8D1; border:1px solid rgba(115,26,30,0.35); border-radius:10px; padding:8px 10px; font-size:0.82rem; margin-bottom:8px;">
                <option value="image/png">PNG (lossless)</option>
                <option value="image/jpeg">JPEG (compressed)</option>
                <option value="image/webp">WebP (modern)</option>
            </select>
            <button class="drawer-full-btn drawer-btn-gold" id="drawerSaveBtn">📜 Save Drawing</button>
        </div>
    </div>

    <!-- People Panel Backdrop -->
    <div id="peoplePanelBackdrop"></div>

    <!-- People Panel -->
    <div id="mobilePeoplePanel">
        <div class="people-panel-header">
            <span class="people-panel-title">🐦‍⬛ Active Crows</span>
            <button class="people-panel-close" id="peoplePanelCloseBtn">✕</button>
        </div>
        <div class="people-panel-list" id="mobilePeopleList">
            <!-- populated by JS mirror of contributorsList -->
        </div>
    </div>

    <script src="canvas.js"></script>
</body>
</html>
