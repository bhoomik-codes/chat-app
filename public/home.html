<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>KASUGAI — Crow Messengers</title>
    <meta name="description" content="KASUGAI real-time private messaging." />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- KASUGAI Theme -->
    <link rel="stylesheet" href="styles/kasugai.css" />

    <!-- Socket.IO Client -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Emoji Picker Library -->
    <script src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js" type="module"></script>

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#10101A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW registration failed:', err));
            });
        }
    </script>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1 class="header-title">KASUGAI</h1>
            <span id="loggedInUsernameDisplay" class="logged-in-username"></span>
            <div class="header-controls">
                <button id="logoutButton" class="logout-button">
                    <i class="fa-solid fa-person-walking-arrow-right"></i> Depart
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <h2 class="sidebar-title">Crow Network</h2>
                <div class="user-search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="userSearch" placeholder="Search demon slayers..." />
                </div>
                <div class="user-list-container">
                    <ul id="userList">
                        <!-- Populated dynamically -->
                    </ul>
                </div>
            </aside>

            <!-- Chat Interface -->
            <section class="interface" id="chatInterface">
                <div class="chat-header">
                    <button id="mobileBackBtn" class="mobile-back-btn">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <h3 id="chat-with-header">Select a crow to begin transmission</h3>
                    <button id="startCanvasBtn" class="canvas-launch-btn hidden" style="margin-left: auto;">
                        <i class="fa-solid fa-paintbrush"></i> Start Scroll
                    </button>
                </div>
                <div class="chatbox" id="chatBox">
                    <!-- Messages loaded here -->
                </div>

                <!-- Input Area Wrapper: sticky bottom, contains reply preview + request bar + input -->
                <div class="input-area-wrapper hidden" id="inputAreaWrapper">

                    <!-- Reply Preview Bar -->
                    <div class="reply-preview-bar hidden" id="replyPreviewBar">
                        <div class="reply-preview-content">
                            <div class="reply-preview-label" id="replyPreviewLabel">Replying to You</div>
                            <div class="reply-preview-text" id="replyPreviewText"></div>
                        </div>
                        <button class="reply-cancel-btn" id="replyCancelBtn" title="Cancel reply">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <!-- Message Input -->
                    <div class="message-input-container" id="messageInputContainer">
                        <div class="emoji-picker-container">
                            <button class="icon-button" id="emojiButton" title="Emoji">
                                <i class="fa-solid fa-face-grin-beam"></i>
                            </button>
                            <emoji-picker class="hidden"></emoji-picker>
                        </div>
                        <input id="m" autocomplete="off" placeholder="Send your crow message..." />
                        <button class="send-button" id="send" title="Send">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>

                </div>

                <!-- Message Request Bar (outside wrapper, shown instead of input) -->
                <div id="messageRequestBar" class="message-request-bar hidden">
                    <div class="request-info">
                        Accept message request from <strong id="requestSenderName"></strong>?
                        <p>If you accept, they will be able to message you freely.</p>
                    </div>
                    <div class="request-actions">
                        <button id="blockRequestBtn" class="request-action-btn block-btn">Block</button>
                        <button id="deleteRequestBtn" class="request-action-btn delete-btn">Ignore</button>
                        <button id="acceptRequestBtn" class="request-action-btn accept-btn">Accept</button>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <script src="index.js" type="module"></script>
</body>

</html>
